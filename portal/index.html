<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'"><title>MOP · Portal de consulta</title><link rel="stylesheet" href="../src/style.css"><link rel="stylesheet" href="portal.css"><script defer src="../src/privacy.js"></script><script defer src="../src/operations.js"></script><script defer src="../src/workbook.js"></script><script defer src="config.js"></script><script defer src="portal.js"></script></head><body><header><strong>MOP · Portal de consulta</strong><button id="logout" hidden>Sair</button></header><main><div id="notice" role="status"></div><section id="login" class="panel"><h1>Acompanhe sua operação</h1><p>Entre com sua conta autorizada. Acesso pelo computador ou celular.</p><form id="loginForm"><label>E-mail<input name="email" type="email" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Entrar</button></form></section><section id="dashboard" hidden><h1>Visão operacional</h1><p id="identity"></p><div class="panel"><form id="filters" class="grid"><label>Condomínio<select name="condo"><option value="">Todos os autorizados</option></select></label><label>Status<select name="status"><option value="">Todos</option><option>Pendente</option><option>Em andamento</option><option>Aguardando resposta</option><option>Aguardando manutenção</option><option>Resolvido</option></select></label><label>A partir de<input name="from" type="date"></label><label>Até<input name="to" type="date"></label></form><div class="actions"><button id="refresh">Atualizar</button><button id="excel">Excel</button><button id="pdf">Imprimir / PDF</button></div><small id="lastUpdate"></small></div><div id="metrics" class="cards"></div><h2>Registros e histórico</h2><div id="records"></div></section></main></body></html>
