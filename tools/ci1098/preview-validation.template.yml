name: Preview validation

on:
  push:
    branches: ["preview/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.7.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui-next/package-lock.json
      - name: Install locked desktop dependencies
        run: npm.cmd ci --no-audit --no-fund
      - name: Install locked UI dependencies
        run: npm.cmd --prefix ui-next ci --no-audit --no-fund
      - name: Check preview configuration
        run: npm.cmd run check:release-config
      - name: Check TypeScript
        run: npm.cmd run check:types
      - name: Test foundation with isolated fixtures
        run: npm.cmd run test:foundation
      - name: Build UI
        run: npm.cmd run build:ui
